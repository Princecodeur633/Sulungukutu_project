}

type TrimesterAverage {
  trimestre: Trimester!
  moyenne: Float!
}

type AbsenceMonthStat {
  mois: Int!
  count: Int!
}

# État des paiements d'un élève (par trimestre)
type PaymentSummary {
  student: Student!
  anneeScolaire: String!
  moisDetails: [Payment!]!
  t1Unlocked: Boolean!
  t2Unlocked: Boolean!
  t3Unlocked: Boolean!
  totalPaid: Int!
  totalUnpaid: Int!
}

