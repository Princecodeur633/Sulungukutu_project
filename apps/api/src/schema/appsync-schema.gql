# ============================================================
# 🎓 SCHOOL MANAGEMENT PLATFORM — GraphQL Schema
# Author  : Kassy Gloire Exaucé
# Version : 1.0.0
# Stack   : GraphQL Yoga + Node.js + PostgreSQL + Drizzle ORM
# ============================================================


# ============================================================
# SCALARS
# ============================================================

scalar DateTime
scalar JSON
scalar Upload


# ============================================================
# ENUMS
# ============================================================

enum Role {
  SUPER_ADMIN
  ADMIN
  TEACHER
  PARENT
  STUDENT
}

enum Gender {
  M
  F
}

enum ParentLink {
  PERE
  MERE
  TUTEUR
}

enum LevelType {
  PRIMAIRE
  COLLEGE
  LYCEE
  UNIVERSITAIRE
}

enum EvalType {
  DEVOIR
  CONTROLE
  EXAMEN
  INTERRO
}

enum AttendanceStatus {
  PRESENT
  ABSENT
  RETARD
}

enum PaymentStatus {
  IMPAYE
  PARTIEL
  PAYE
  ANNULE
  EXONERE
}

enum PaymentMode {
  ESPECES
  MOBILE_MONEY
  MOBILE_MONEY_SIMULE
  VIREMENT
  CHEQUE
  AUTRE
}

enum TransactionChannel {
  GUICHET
  DISTANCE
}

enum TransactionStatus {
  EN_ATTENTE
  VALIDEE
  ECHOUEE
  ANNULEE
}

enum TransactionFailureCode {
  SOLDE_INSUFFISANT
  NUMERO_INVALIDE
  ERREUR_RESEAU
  DELAI_EXPIRE
}

enum BulletinStatus {
  BROUILLON
  PUBLIE
  ARCHIVE
}

enum NotificationType {
  PAIEMENT
  ABSENCE
  BULLETIN
  ANNONCE
  SYSTEME
  MESSAGE
}

enum AnnouncementTarget {
  ALL
  PARENTS
  TEACHERS
  STUDENTS
  ADMINS
}

enum MembershipStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
}

enum AuditAction {
  # Paiements
  PAYMENT_CREATED
  PAYMENT_UPDATED
  PAYMENT_EXONERATED
  # Bulletins
  BULLETIN_GENERATED
  BULLETIN_UPDATED
  BULLETIN_DELETED
  BULLETIN_PUBLISHED
  BULLETIN_ARCHIVED
  # Utilisateurs
  USER_CREATED
  USER_UPDATED
  USER_DELETED
  USER_INVITED
  USER_ROLE_CHANGED
  # Notes
  GRADE_CREATED
  GRADE_UPDATED
  GRADE_DELETED
  # Présences
  ATTENDANCE_MARKED
  ATTENDANCE_UPDATED
  # École
  SCHOOL_CREATED
  SCHOOL_UPDATED
  CLASS_CREATED
  CLASS_UPDATED
  CLASS_DELETED
  SUBJECT_CREATED
  SUBJECT_UPDATED
  SUBJECT_DELETED
  CLASS_SUBJECT_ASSIGNED
  CLASS_SUBJECT_UNASSIGNED
  # Annonces
  ANNOUNCEMENT_CREATED
  ANNOUNCEMENT_DELETED
}

enum Trimester {
  T1
  T2
  T3
}

enum Mention {
  EXCELLENT
  TRES_BIEN
  BIEN
  ASSEZ_BIEN
  PASSABLE
  INSUFFISANT
}

enum ExportType {
  GRADES
  ATTENDANCE
  PAYMENTS
  STUDENTS
  AUDIT_LOG
}


# ============================================================
# TYPES — CORE ENTITIES
# ============================================================

# ------ Profil Global ------
type GlobalProfile {
  id: ID!
  code: String!              # USR-KGL-4F2A
  nom: String!
  prenom: String!
  email: String!
  phone: String
  avatarUrl: String
  isSuperAdmin: Boolean!
  memberships: [SchoolMembership!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------ School ------
type School {
  id: ID!
  code: String!              # SCH-LKG-0001
  nom: String!
  logoUrl: String
  adresse: String
  telephone: String
  anneeScolaire: String!
  accentColor:   String     # 2024-2025
  memberships: [SchoolMembership!]!
  levels: [Level!]!
  classes: [Class!]!
  subjects: [Subject!]!
  announcements: [Announcement!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------ School Membership (lien profil <-> école <-> rôle) ------
type SchoolMembership {
  id: ID!
  profile: GlobalProfile!
  school: School!
  role: Role!
  code: String!              # TCH-KGL-4F2A
  status: MembershipStatus!
  joinedAt: DateTime!
  # Relations selon le rôle
  studentProfile: Student
  classSubjects: [ClassSubject!]  # si TEACHER
}

# Annuaire des utilisateurs — vérification/rappel d'identifiants par
# téléphone (SUPER_ADMIN : toute la plateforme sauf lui-même ; ADMIN :
# uniquement enseignants/parents/élèves de son établissement). Ne
# contient JAMAIS de mot de passe — voir adminResetPassword pour générer
# un nouveau mot de passe à communiquer si la personne l'a perdu.
type UserDirectoryEntry {
  membershipId: ID!
  code: String!            # identifiant de connexion
  matricule: String        # uniquement pour un élève
  nom: String!
  prenom: String!
  email: String!
  phone: String
  role: Role!
  status: MembershipStatus!
  schoolName: String!
  joinedAt: DateTime!
}

# ------ Level ------
type Level {
  id: ID!
  school: School!
  nom: String!
  type: LevelType!
  ordre: Int!
  classes: [Class!]!
  # Activation/personnalisation du référentiel national (jamais une saisie libre)
  nationalLevelId: ID
  isActive: Boolean!
  deletedAt: DateTime
  createdAt: DateTime!
}

# ------ Référentiel National (Congo-Brazzaville) ------
# Données globales, mutualisées entre tous les établissements. Gérées par le
# Super Admin uniquement ; les écoles n'y écrivent jamais, elles activent un
# sous-ensemble via Level.nationalLevelId / Subject.nationalSubjectId.
type NationalLevel {
  id: ID!
  cycle: LevelType!
  nom: String!
  ordre: Int!
}

type NationalSeries {
  id: ID!
  code: String!
  nom: String!
}

type NationalSubject {
  id: ID!
  code: String!
  nom: String!
}

type NationalCurriculumEntry {
  id: ID!
  nationalLevelId: ID!
  nationalSeriesId: ID
  nationalSubjectId: ID!
  coefficient: Float!
  volumeHoraireHebdo: Int
}

type NationalReferential {
  levels: [NationalLevel!]!
  series: [NationalSeries!]!
  subjects: [NationalSubject!]!
  curriculum: [NationalCurriculumEntry!]!
}

# ------ Class ------
type Class {
  id: ID!
  school: School!
  level: Level!
  nationalSeriesId: ID        # série nationale (Lycée), ex: "D" pour "Terminale D1"
  nom: String!               # 4ème A
  anneeScolaire: String!
  isActive: Boolean!
  deletedAt: DateTime
  classSubjects: [ClassSubject!]!
  students: [Student!]!
  studentCount: Int!
  createdAt: DateTime!
}

# ------ Subject ------
type Subject {
  id: ID!
  school: School!
  nom: String!
  description: String
  classSubjects: [ClassSubject!]!
  nationalSubjectId: ID
  isActive: Boolean!
  deletedAt: DateTime
  createdAt: DateTime!
}

# ------ ClassSubject (pivot Classe <-> Matière <-> Enseignant) ------
type ClassSubject {
  id: ID!
  class: Class
  subject: Subject!
  teacher: SchoolMembership!
  coefficient: Float!
  hoursPerWeek: Int
  grades: [Grade!]!
  attendances: [Attendance!]!
  schedules: [Schedule!]!
  isActive: Boolean!
  deletedAt: DateTime
  createdAt: DateTime!
}


# ── Recherche Globale ─────────────────────────────────────────
type GlobalSearchResult {
  type:        String!   # 'student' | 'teacher' | 'class' | 'subject'
  id:          ID!
  label:       String!
  sublabel:    String
  href:        String!
}

# ------ Student ------
type Student {
  id: ID!
  membership: SchoolMembership!
  class: Class
  matricule: String!         # = code du membership student
  tempPassword: String
  parentTempPassword: String
  dateNaissance: String
  sexe: Gender
  parents: [ParentStudent!]!
  grades: [Grade!]!
  attendances: [Attendance!]!
  payments: [Payment!]!
  bulletins: [Bulletin!]!
  isActive: Boolean!
  deletedAt: DateTime
  createdAt: DateTime!
}

# ------ Parent <-> Student link ------
type ParentStudent {
  id: ID!
  parent: SchoolMembership!
  student: Student!
  lien: ParentLink!
}

# ------ Grade (Note) ------
type Grade {
  id: ID!
  student: Student!
  classSubject: ClassSubject!
  valeur: Float!             # 0 - 20
  typeEval: EvalType!
  trimestre: Trimester!
  dateSaisie: String
  enseignant: SchoolMembership!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------ Attendance (Présence) ------
type Attendance {
  id: ID!
  studentId: ID
  student: Student!
  classSubject: ClassSubject!
  date: String!
  statut: AttendanceStatus!
  motif: String
  markedBy: SchoolMembership!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------ Payment ------
type Payment {
  id: ID!
  student: Student!
  mois: Int!                 # 1 - 9
  anneeScolaire: String!
  statut: PaymentStatus!
  montantDu: Float!
  montantPaye: Float!
  datePaiement: String
  updatedBy: SchoolMembership
  recuUrl: String            # URL du reçu PDF (uniquement si PAYE ou EXONERE)
  transactions: [PaymentTransaction!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Transaction individuelle (guichet ou distance) — journal immuable
type PaymentTransaction {
  id: ID!
  payment: Payment!
  student: Student!
  montant: Float!
  devise: String!
  mode: PaymentMode!
  canal: TransactionChannel!
  statut: TransactionStatus!
  codeEchec: TransactionFailureCode
  numeroTelephone: String
  numeroRecu: String
  transactionRef: String!
  agent: SchoolMembership
  observations: String
  annuleTransactionId: ID
  recuUrl: String             # URL du reçu PDF (si statut = VALIDEE)
  createdAt: DateTime!
  updatedAt: DateTime!
}

# Résultat renvoyé par les mutations d'encaissement/paiement à distance
type PaymentOperationResult {
  transaction: PaymentTransaction!
  payment: Payment
}

# ------ Bulletin ------
type Bulletin {
  id: ID!
  student: Student!
  trimestre: Trimester!
  anneeScolaire: String!
  statut: BulletinStatus!
  pdfUrl: String
  moyenneGenerale: Float
  rang: Int
  mention: Mention
  isDownloadable: Boolean!   # false si paiements du trimestre incomplets
  details: [BulletinDetail!]!
  generatedAt: DateTime
  updatedAt: DateTime!
}

# Détail d'une matière dans le bulletin
type BulletinDetail {
  id: ID!
  bulletin: Bulletin!
  classSubject: ClassSubject!
  moyenneMatiere: Float!
  coefficient: Float!
  pointsObtenus: Float!      # moyenne × coefficient
  appreciation: String
}

# ------ Schedule (Emploi du temps) ------
type Schedule {
  id: ID!
  classSubject: ClassSubject!
  jour: Int!                 # 1=Lundi … 6=Samedi
  heureDebut: String!        # "08:00"
  heureFin: String!          # "09:00"
  salle: String
  createdAt: DateTime!
}

# ------ Message ------
type Message {
  id: ID!
  school: School!
  sender: SchoolMembership!
  receiver: SchoolMembership!
  sujet: String!
  contenu: String!
  lu: Boolean!
  createdAt: DateTime!
}

# ------ Notification ------
type Notification {
  id: ID!
  profile: GlobalProfile!
  school: School
  titre: String!
  message: String!
  type: NotificationType!
  lu: Boolean!
  createdAt: DateTime!
}

# ------ Announcement ------
type Announcement {
  id: ID!
  school: School!
  auteur: SchoolMembership!
  titre: String!
  contenu: String!
  cible: AnnouncementTarget!
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ------ Audit Log ------
type AuditLog {
  id: ID!
  school: School!
  actor: SchoolMembership!
  action: AuditAction!
  entityType: String!        # "student" | "bulletin" | "grade" | "payment" ...
  entityId: ID!
  oldValue: JSON
  newValue: JSON
  description: String        # message lisible humain
  createdAt: DateTime!
}


# ============================================================
# TYPES — AUTH & SESSION
# ============================================================

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  profile: GlobalProfile!
  currentMembership: SchoolMembership
  availableMemberships: [SchoolMembership!]!
}

type SwitchWorkspacePayload {
  accessToken: String!
  refreshToken: String
  membership: SchoolMembership!
}


# ============================================================
# TYPES — ANALYTICS & DASHBOARD
