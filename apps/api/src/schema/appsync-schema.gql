  limit: Int! = 20
}

input AuditLogFilter {
  schoolId: ID!
  action: AuditAction
  entityType: String
  actorId: ID
  startDate: DateTime
  endDate: DateTime
}

input GradeFilter {
  studentId: ID
  classSubjectId: ID
  trimestre: Trimester
  typeEval: EvalType
}

input AttendanceFilter {
  studentId: ID
  classSubjectId: ID
  statut: AttendanceStatus
  startDate: DateTime
  endDate: DateTime
}


# ============================================================
# QUERIES
# ============================================================

type ProfilePage {
  data: [GlobalProfile!]!
  pageInfo: PageInfo!
}

type Query {

  # ---- AUTH / PROFIL ----
  me: GlobalProfile!
  myMemberships: [SchoolMembership!]!
  myCurrentMembership(schoolId: ID!): SchoolMembership

  # ---- SUPER ADMIN ----
  superAdminDashboard: SuperAdminDashboard!
  allSchools(pagination: PaginationInput): SchoolPage!
  schoolById(id: ID!): School
  allProfiles(pagination: PaginationInput): ProfilePage!

  # ---- SCHOOL ----
  mySchool(schoolId: ID!): School!
  schoolMembers(schoolId: ID!, role: Role, pagination: PaginationInput): MembershipPage!

  # ---- DASHBOARD ----
  adminDashboard(schoolId: ID!): AdminDashboard!
  teacherDashboard(schoolId: ID!): TeacherDashboard!
  parentDashboard(schoolId: ID!): ParentDashboard!
  studentDashboard(schoolId: ID!): StudentDashboard!

  # ---- LEVELS ----
  # Référentiel national complet (Congo-Brazzaville), en lecture seule —
  # sert notamment à afficher les niveaux/séries/matières disponibles
  # avant activation par un établissement.
  nationalReferential: NationalReferential!

  # Annuaire des identifiants. SUPER_ADMIN : schoolId optionnel (omis =
  # toute la plateforme, hors autres super admins). ADMIN : forcé sur sa
  # propre école, rôles enseignant/parent/élève uniquement.
  usersDirectory(schoolId: ID): [UserDirectoryEntry!]!

  levelsBySchool(schoolId: ID!): [Level!]!
  levelById(id: ID!): Level

  # ---- CLASSES ----
  classesBySchool(schoolId: ID!, levelId: ID): [Class!]!
  classesByTeacher(schoolId: ID!): [Class!]!
  classById(id: ID!): Class

  # ---- SUBJECTS ----
  subjectsBySchool(schoolId: ID!): [Subject!]!
  subjectById(id: ID!): Subject

  # ---- CLASS SUBJECTS ----
  classSubjectsByClass(classId: ID!): [ClassSubject!]!
  classSubjectsByTeacher(schoolId: ID!): [ClassSubject!]!
  classSubjectById(id: ID!): ClassSubject

  # ---- STUDENTS ----
  studentsByClass(classId: ID!, pagination: PaginationInput): StudentPage!
  studentsBySchool(schoolId: ID!, pagination: PaginationInput): StudentPage!
  studentById(id: ID!): Student
  studentStats(studentId: ID!, anneeScolaire: String!): StudentStats!
  myStudentProfile(schoolId: ID!): Student!

  # ---- PARENTS ----
  myChildren(schoolId: ID!): [Student!]!
  childSummary(studentId: ID!): StudentSummary!

  # ---- GRADES ----
  gradesByStudent(filter: GradeFilter!, pagination: PaginationInput): GradePage!
  gradesByClassSubject(classSubjectId: ID!, trimestre: Trimester): [Grade!]!
  gradesByClass(classId: ID!, trimestre: Trimester!): [Grade!]!
  gradeById(id: ID!): Grade

  # ---- ATTENDANCE ----
  attendanceByClassSubject(classSubjectId: ID!, date: String!): [Attendance!]!
  attendanceByStudent(filter: AttendanceFilter!, pagination: PaginationInput): AttendancePage!
  attendanceSummary(studentId: ID!, anneeScolaire: String!): AbsenceMonthStat

  # ---- PAYMENTS ----
  paymentsByStudent(studentId: ID!, anneeScolaire: String!): PaymentSummary!
  unpaidStudents(schoolId: ID!, anneeScolaire: String!, mois: Int!): [Student!]!
  paymentsByClass(classId: ID!, anneeScolaire: String!): [PaymentSummary!]!
  paymentTransactionHistory(studentId: ID!, anneeScolaire: String): [PaymentTransaction!]!

  # ---- BULLETINS ----
  bulletinsByStudent(studentId: ID!, anneeScolaire: String!): [Bulletin!]!
  bulletinById(id: ID!): Bulletin
  bulletinsByClass(classId: ID!, trimestre: Trimester!, anneeScolaire: String!): [Bulletin!]!

  # ---- SCHEDULES ----
  scheduleByClass(classId: ID!): [Schedule!]!
  # Emploi du temps d'un enseignant précis (par membershipId) — utilisé côté
  # admin pour avertir d'un conflit AVANT la création d'un créneau, plutôt
  # que de laisser l'admin découvrir le conflit seulement après coup.
  scheduleByTeacherMembership(teacherMembershipId: ID!): [Schedule!]!
  scheduleByTeacher(schoolId: ID!): [Schedule!]!

  # ---- MESSAGES ----
  myMessages(schoolId: ID!, pagination: PaginationInput): MessagePage!
  conversation(schoolId: ID!, withMembershipId: ID!, pagination: PaginationInput): MessagePage!
  unreadMessageCount(schoolId: ID!): Int!

  # ---- NOTIFICATIONS ----
  myNotifications(pagination: PaginationInput): NotificationPage!
  unreadNotificationCount: Int!

  # ---- ANNOUNCEMENTS ----
  announcementsBySchool(schoolId: ID!): [Announcement!]!
  announcementById(id: ID!): Announcement

  # ---- AUDIT LOGS ----
  auditLogs(filter: AuditLogFilter!, pagination: PaginationInput): AuditLogPage!

  # ---- SEARCH ----
  # Email, code identifiant, OU téléphone (le nom du paramètre reste
  # emailOrCode pour compatibilité, mais accepte aussi un numéro).
  searchProfile(emailOrCode: String!): GlobalProfile
  searchStudents(schoolId: ID!, query: String!): [Student!]!
  searchMembers(schoolId: ID!, query: String, role: Role): [SchoolMembership!]!
  globalSearch(schoolId: ID!, query: String!): [GlobalSearchResult!]!

}


# ============================================================
# MUTATIONS
# ============================================================

type Mutation {

  # ---- AUTH ----
  login(input: LoginInput!): AuthPayload!
  logout: Boolean!
  refreshToken(token: String!): AuthPayload!
  switchWorkspace(schoolId: ID!): SwitchWorkspacePayload!
  changePassword(input: ChangePasswordInput!): Boolean!

  # Email, identifiant ou téléphone — comme pour login(). Ne révèle jamais
  # si le compte existe. Si l'utilisateur n'a pas d'email personnel réel
  # (uniquement l'email interne généré automatiquement), aucun email ne
  # part réellement — seul un admin peut alors utiliser adminResetPassword.
  requestPasswordReset(identifiant: String!): Boolean!
  confirmPasswordReset(token: String!, newPassword: String!): Boolean!

  # Réinitialisation en présentiel par un admin d'école — seul canal fiable
  # pour les utilisateurs sans email personnel (fréquent chez les parents
  # et élèves). Renvoie le nouveau mot de passe à remettre en main propre.
  adminResetPassword(membershipId: ID!): AdminResetPasswordResult!
  updateProfile(input: UpdateProfileInput!): GlobalProfile!
  uploadAvatar(file: Upload!): GlobalProfile!

  # ---- SUPER ADMIN ----
  createSchool(input: CreateSchoolInput!): CreateSchoolResult!
  updateSchoolBySuper(schoolId: ID!, input: UpdateSchoolInput!): School!
  deactivateSchool(schoolId: ID!): Boolean!

  # ---- SCHOOL (Admin) ----
  updateSchool(input: UpdateSchoolInput!): School!

  # ---- LEVELS ----
  createLevel(input: CreateLevelInput!): Level!
  updateLevel(id: ID!, input: CreateLevelInput!): Level!
  deleteLevel(id: ID!): Boolean!        # soft delete — restaurable
  restoreLevel(id: ID!): Level!

  # Active/désactive un niveau ou une matière déjà provisionnés depuis le
  # référentiel national. Ne modifie JAMAIS le référentiel lui-même —
  # seulement l'activation locale à l'établissement.
  toggleSchoolLevel(levelId: ID!, isActive: Boolean!): Level!
  toggleSchoolSubject(subjectId: ID!, isActive: Boolean!): Subject!

  # ---- CLASSES ----
  createClass(input: CreateClassInput!): Class!
  updateClass(id: ID!, input: UpdateClassInput!): Class!
  deleteClass(id: ID!): Boolean!        # soft delete — restaurable
  restoreClass(id: ID!): Class!

  # ---- SUBJECTS ----
  createSubject(input: CreateSubjectInput!): Subject!
  updateSubject(id: ID!, input: UpdateSubjectInput!): Subject!
  deleteSubject(id: ID!): Boolean!      # soft delete — restaurable
  restoreSubject(id: ID!): Subject!

  # ---- CLASS SUBJECTS ----
  assignClassSubject(input: AssignClassSubjectInput!): ClassSubject!
  updateClassSubject(id: ID!, input: UpdateClassSubjectInput!): ClassSubject!
  removeClassSubject(id: ID!): Boolean!

  # ---- USERS / MEMBERSHIPS ----
  inviteUser(input: InviteUserInput!): InviteResult!
  createStudent(input: CreateStudentInput!): Student!
  updateStudent(id: ID!, input: UpdateStudentInput!): Student!
  deleteStudent(id: ID!): Boolean!        # soft delete — restaurable
  restoreStudent(id: ID!): Boolean!
  linkParentStudent(input: LinkParentStudentInput!): ParentStudent!
  unlinkParentStudent(parentMembershipId: ID!, studentId: ID!): Boolean!
  updateMembershipStatus(input: UpdateMembershipStatusInput!): SchoolMembership!
  transferStudentClass(studentId: ID!, newClassId: ID!): Student!

  # ---- GRADES ----
  createGrade(input: CreateGradeInput!): Grade!
  bulkCreateGrades(input: BulkCreateGradesInput!): [Grade!]!
  updateGrade(id: ID!, input: UpdateGradeInput!): Grade!
  deleteGrade(id: ID!): Boolean!        # soft delete — restaurable
  restoreGrade(id: ID!): Grade!

  # ---- ATTENDANCE ----
  markAttendance(input: MarkAttendanceInput!): [Attendance!]!
  updateAttendance(id: ID!, input: UpdateAttendanceInput!): Attendance!

  # ---- PAYMENTS ----
  updatePaymentStatus(input: UpdatePaymentStatusInput!): [Payment!]!
  recordManualPayment(input: RecordManualPaymentInput!): PaymentOperationResult!
  cancelPaymentTransaction(input: CancelPaymentTransactionInput!): PaymentOperationResult!
  initiateRemotePayment(input: InitiateRemotePaymentInput!): PaymentOperationResult!

  # ---- BULLETINS ----
  generateBulletins(input: GenerateBulletinsInput!): [Bulletin!]!
  updateBulletin(id: ID!, input: UpdateBulletinInput!): Bulletin!
  deleteBulletin(id: ID!): Boolean!
  publishBulletin(id: ID!): Bulletin!
  generateBulletinPdf(bulletinId: ID!): Bulletin!
  archiveBulletin(id: ID!): Bulletin!
  regenerateBulletin(id: ID!): Bulletin!

  # ---- SCHEDULES ----
  createSchedule(input: CreateScheduleInput!): Schedule!
  updateSchedule(id: ID!, input: UpdateScheduleInput!): Schedule!
  deleteSchedule(id: ID!): Boolean!

  # ---- MESSAGES ----
  sendMessage(input: SendMessageInput!): Message!
  markMessageAsRead(id: ID!): Message!
  markAllMessagesAsRead(schoolId: ID!): Boolean!
  deleteMessage(id: ID!): Boolean!

  # ---- NOTIFICATIONS ----
  markNotificationAsRead(id: ID!): Notification!
  markAllNotificationsAsRead: Boolean!
  deleteNotification(id: ID!): Boolean!

  # ---- ANNOUNCEMENTS ----
  createAnnouncement(input: CreateAnnouncementInput!): Announcement!
  updateAnnouncement(id: ID!, input: CreateAnnouncementInput!): Announcement!
  deleteAnnouncement(id: ID!): Boolean!  # soft delete — restaurable
  restoreAnnouncement(id: ID!): Announcement!

  # ---- EXPORT ----
  exportData(input: ExportInput!): ExportResult!
}


# ============================================================
# SUBSCRIPTIONS
# ============================================================

type Subscription {

  # Nouvelle notification en temps réel
  notificationAdded(profileId: ID!): Notification!

  # Nouveau message reçu
  messageReceived(schoolId: ID!, membershipId: ID!): Message!

  # Mise à jour présences (admin voit en temps réel)
  attendanceUpdated(classSubjectId: ID!): Attendance!

  # Mise à jour statut bulletin
  bulletinStatusChanged(studentId: ID!): Bulletin!

  # Mise à jour statut paiement
  paymentStatusChanged(studentId: ID!): Payment!

  # Dénouement d'un paiement à distance simulé (Mobile Money), suivi par
  # référence de transaction — utile pour un écran "en attente de confirmation".
  remotePaymentStatusChanged(transactionId: ID!): PaymentTransaction!

  # Nouvelle annonce dans l'école
  announcementPublished(schoolId: ID!): Announcement!
}
