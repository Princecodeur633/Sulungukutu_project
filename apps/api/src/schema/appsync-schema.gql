# ============================================================
# INPUT TYPES
# ============================================================

# ------ Auth ------
input LoginInput {
  # Email, identifiant de connexion (matricule, ex: STU-A1B2) ou téléphone.
  # Beaucoup d'utilisateurs (parents, élèves) n'ont pas d'email personnel :
  # l'identifiant ou le téléphone sont des moyens de connexion à part entière.
  identifiant: String!
  password: String!
}

type AdminResetPasswordResult {
  tempPassword: String!
  # false si l'utilisateur n'a qu'un email interne généré automatiquement
  # (donc aucun email n'a réellement pu être envoyé — l'admin doit
  # communiquer le mot de passe en personne).
  hasRealEmail: Boolean!
}

# Avant : createSchool renvoyait juste School!, sans jamais exposer le
# mot de passe temporaire généré pour l'admin — impossible de le
# communiquer après la création (aucun email n'est envoyé si l'admin n'a
# qu'un téléphone).
type CreateSchoolResult {
  school: School!
  adminIdentifiant: String!   # email si fourni, sinon identifiant de connexion
  adminTempPassword: String!
  hasRealEmail: Boolean!
}

input RegisterProfileInput {
  nom: String!
  prenom: String!
  email: String!
  password: String!
  phone: String
}

input UpdateProfileInput {
  nom: String
  prenom: String
  email: String
  phone: String
  avatarUrl: String
}

input ChangePasswordInput {
  oldPassword: String!
  newPassword: String!
}

# ------ Super Admin ------
input CreateSchoolInput {
  nom: String!
  adresse: String
  telephone: String
  anneeScolaire: String!
  logoUrl: String
  # Données admin initial de l'école — email OU téléphone requis (l'un des deux)
  adminNom: String!
  adminPrenom: String!
  adminEmail: String
  adminPhone: String
  # Cycles à activer automatiquement depuis le référentiel national
  # (par défaut : PRIMAIRE, COLLEGE et LYCEE — l'universitaire n'est pas
  # proposé). L'admin pourra ensuite activer/désactiver des niveaux
  # individuellement sans jamais modifier le référentiel lui-même.
  cycles: [LevelType!]
  # Numéros de division créés par défaut pour chaque niveau SANS série
  # (ex: ["1","2"] crée "6ème 1" ET "6ème 2"). Par défaut : ["1","2","3","4"]
  # (4 divisions). Les lettres (A/C/D...) restent réservées aux séries de lycée.
  divisions: [String!]
}

# ------ School ------
input UpdateSchoolInput {
  nom: String
  adresse: String
  telephone: String
  logoUrl: String
  anneeScolaire: String
  accentColor: String
}

# ------ Level ------
input CreateLevelInput {
  schoolId: ID!
  nom: String!
  type: LevelType!
  ordre: Int!
}

# ------ Class ------
input CreateClassInput {
  schoolId: ID!
  levelId: ID!
  nom: String!
  anneeScolaire: String!
}

input UpdateClassInput {
  nom: String
  levelId: ID
}

# ------ Subject ------
input CreateSubjectInput {
  schoolId: ID!
  nom: String!
  description: String
}

input UpdateSubjectInput {
  nom: String
  description: String
}

# ------ ClassSubject ------
input AssignClassSubjectInput {
  classId: ID!
  subjectId: ID!
  teacherMembershipId: ID!
  coefficient: Float!
  hoursPerWeek: Int
}

input UpdateClassSubjectInput {
  teacherMembershipId: ID
  coefficient: Float
  hoursPerWeek: Int
}

# ------ User / Membership ------
input InviteUserInput {
  schoolId: ID!
  role: Role!
  # Invitation par email OU code profil
  email: String
  profileCode: String
  # Si nouveau profil
